[project]
name = "sg-legal-help"
version = "0.1.0"
description = "Zeeker database project for sg-legal-help"
requires-python = ">=3.12"

dependencies = [
    "zeeker>=0.9.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "tenacity>=9.1.2",
    "click>=8.1.0",
    "openai>=1.99.6",
]

[dependency-groups]
dev = ["black>=25.1.0", "ruff>=0.8.0", "pytest>=8.4.1"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # Focus on essential errors, warnings, and imports
ignore = ["E501"]  # Line too long (handled by black)

[tool.ruff.lint.isort]
# Sibling modules in resources/ import bare (zeeker >= 0.9.0 puts that dir on
# sys.path during resource-module load) — classify them as first-party.
known-first-party = ["build_state", "http_client", "ids", "sources", "summary"]
