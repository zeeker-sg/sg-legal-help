name: CI

on:
  pull_request:

  push:
    branches: [main]

# Least privilege: read-only access to the repo so actions/checkout can fetch
# it (a fully empty token cannot read this private repository). No write
# scopes are granted.
permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-24.04
    env:
      # Pin Python rather than using the runner's system interpreter, which
      # changes under us (ubuntu-latest moved to 3.14 in Nov 2026). 3.12
      # matches requires-python and the repo's sync/deploy workflows.
      UV_PYTHON: "3.12"
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.14"

      - name: Verify the committed lockfile satisfies pyproject.toml
        run: uv lock --locked

      - name: Install the locked environment
        run: uv sync --locked

      - name: Run the offline test suite
        run: uv run pytest tests -vv